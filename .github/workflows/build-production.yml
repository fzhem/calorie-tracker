name: Build Production App

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up JDK 25
        uses: actions/setup-java@1d018f9b8b9b505bb578a83b230fabcce01af93b
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Prebuild Android
        run: npm run prebuild

      - name: Build APK
        if: github.event.inputs.build_type == 'apk'
        run: cd android && ./gradlew assembleRelease -Dorg.gradle.jvmargs="-XX:+IgnoreUnrecognizedVMOptions -XX:+UseG1GC"

      - name: Build AAB
        if: github.event.inputs.build_type == 'aab'
        run: cd android && ./gradlew bundleRelease -Dorg.gradle.jvmargs="-XX:+IgnoreUnrecognizedVMOptions -XX:+UseG1GC"

      - name: Upload APK artifact
        if: github.event.inputs.build_type == 'apk'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-release.apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Upload AAB artifact
        if: github.event.inputs.build_type == 'aab'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
